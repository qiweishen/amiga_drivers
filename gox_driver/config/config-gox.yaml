# =============================================================
# GoX Driver Configuration
# =============================================================

# JAI GO-X RGB cameras, one cameras[] entry per camera.
# Referenced by config/config-main.yaml ("GOX Driver Config Path").



# --- Cameras ---
cameras:
    -   id: cam0                        # 1..63 chars [A-Za-z0-9_-]; used as directory name
        enabled: true                   # at least one camera must be enabled
        device:
            mac: ""                     # discovery match; wins over ip
            ip: "10.95.1.101"           # direct connect; used when mac is empty

        acquisition:
            exposure_ms: 150.0              # > 0; < 900 / frame_rate_hz (10% period margin, freerun and SensorSync pulses alike)
            gain: 1.0                       # 1.0..126.0 (magnification, not dB, p.148)
            pixel_format: BayerRG12Packed   # GenICam entry, verbatim; 12-bit formats also set SensorDigitizationBits
            frame_rate_hz: 5.0              # >= 0.125 freerun; external + sensor_trigger: the SensorSync pulse rate, 1..10 Hz (12-bit packed full frame: <= ~5.8 fps, p.48-53)
            blemish_correction: false       # false = BlemishEnable off, raw sensor pixels (p.156, p.82)
            trigger:
                mode: external          # freerun | external
                activation: rising      # rising | falling (TriggerActivation 1 | 2, p.142)
                selector_entry: FrameStart
                source_entry: 24        # 7..19 | 24 | 36 | 37 or an entry name; 24 = Line5 Opt In, pins 2/3 of the 6-pin connector (p.17, p.141)
                delay_ms: 0.0           # 0..500; TriggerDelay, exposure start after the trigger edge (p.142)
                input_filter_ns: 0      # 0..40000000 step 100; OptInFilter debounce on Line5 (p.145); keep << the 50 us pulse
                exposure_active_output: true    # Line2 Opt Out (pins 4/5) = ExposureActive: LineSelector 21, LineSource 4 (p.143-144)
                sensor_channel: 2       # 2 | 3: SensorSync JAI trigger output / strobe input pair wired to this camera
            roi:
                width: 0                # 0 = keep | >= 96, step 8
                height: 0               # 0 = keep | >= 8, step 2
                offset_x: 0             # step 8
                offset_y: 0             # step 2

        features:
            raw: []                     # [{ name: Node, value: Entry }, ...]; applied after acquisition; quote enum/string values

        # =============================================================
        # ADVANCED: do not change without a reason
        # =============================================================
        network:
            buffer_count: 0             # 0 = auto | >= 4 (one buffer = one frame, ~18.6 MB)
            packet_size: 0              # 0 = negotiate | 1476..12036 (p.130)
            socket_rx_buffer_mb: 16     # 1..1024
            local_ip: ""                # bind to this NIC; "" = auto
            throughput_safety_margin_pct: 0     # 0 = factory 92 | 10..100 (p.128); ~100/N for N cameras on one NIC
            receiver_tuning: []         # PvStream parameters, same format as features.raw


# --- Sensor Trigger (Teensy SensorSync, 3rd_party/External/sensor_trigger) ---
# The rig's one board, shared with the FX10 driver: its serial port is named once in
# config/config-main.yaml ("Sensor Trigger: Port"); this block only declares participation
# (the channel is per camera: trigger.sensor_channel). One session per rig
# (common::SensorSyncHub): the JAI pair (channels 2/3) pulses at the cameras' frame_rate_hz
# and their Line2 ExposureActive strobes are logged into raw/sensor_trigger.log. Pulses
# start once every registered camera is armed and stop before the first camera stops.
sensor_trigger:
    enabled: true


# =============================================================
# ADVANCED: do not change without a reason
# =============================================================
# --- PTP ---
# PTP is the camera's only absolute time (grandmaster: AsteRx RBi3 Pro+, GPS timescale; host time is never used).
# enabled: false is accepted but warned: the frames then carry free-running ticks that cannot be associated offline.
ptp:
    enabled: false
    sync_timeout_s: 10.0                # > 0
    on_timeout: abort                   # abort | warn_continue


# --- Output (jai-raw-seg) ---
output:
    segment_size_mb: 2048               # > 0
    record_align: 4096                  # power of two; 1 = none
    queue_max_frames: 0                 # 0 = auto (~2 s) | >= 2
    queue_on_full: drop_newest          # drop_newest | block; any dropped frame ends the whole rig (fail-fast)
    on_buffer_error: record_flagged     # record_flagged | drop
    flush_interval_mb: 64               # > 0; writer fdatasyncs raw data then index at this byte cadence
    max_frames: 0                       # >= 0; 0 = unlimited
    max_duration_s: 0                   # >= 0; 0 = unlimited


# --- Logging ---
logging:
    stats_interval_s: 2.5               # > 0
