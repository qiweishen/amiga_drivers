# =============================================================
# GoX Driver Configuration --- For Snapshot
# =============================================================

# JAI GoX RGB camera configuration.

# *************************************************************
# For Snapshot
# *************************************************************

# Single-shot capture profile for jai_snapshot (GUI preview / exposure tuning).
# - device.ip and exposure/gain are placeholders: the GUI overrides them per
#   shot via --ip / --exposure-us / --gain (this file is never rewritten).
# - jai_snapshot unconditionally forces max_frames=1, max_duration_s<=15,
#   ptp.enabled=false and trigger freerun, even if this file is edited.
# - acquisition.pixel_format must stay within the PFNC table supported by
#   scripts/unpack_raw.py, otherwise the PNG decode fails.

# --- General Settings ---
cameras:
    -   id: "cam0"
        enabled: true

        device:
            mac: ""                     # GUI overrides via --ip/--mac
            ip: "10.95.76.106"          # placeholder; the GUI passes --ip
            force_ip:
                enabled: false
                ip: ""
                subnet_mask: ""
                gateway: "0.0.0.0"

        # --- Receiver Settings ---
        acquisition:
            exposure_ms: 20.0           # placeholder; the GUI passes --exposure-us
            gain: 1.0                   # placeholder; the GUI passes --gain
            pixel_format: "BayerRG12Packed" # must be in unpack_raw.py's PFNC table
            trigger:
                mode: freerun           # forced by jai_snapshot anyway

        features:
            raw: [ ]

        # --- Network Transfer Settings ---
        network:
            channel: 0
            buffer_count: 16            # constraint: 0 (auto) or >= 4
            packet_size: 0              # 0 = NegotiatePacketSize (fallback 1476)
            socket_rx_buffer_mb: 16
            local_ip: ""
            gev_scpd_ticks: 0
            receiver_tuning: [ ]


# =============================================================
# NOT RECOMMEND TO CHANGE
# =============================================================
# --- Output Settings ---
output:
    output_dir: "/workspace/app/_runtime/snapshot" # fallback; the GUI always overrides via --out
    segment_size_gib: 1.0
    record_align: 4096
    queue_max_frames: 4                 # only 1 frame: minimize memory (pool = queue + 2)
    queue_on_full: "block"              # the single frame must never be dropped
    on_buffer_error: "record_flagged"   # record incomplete frames too; unpack pads them with --pad-incomplete
    flush_interval_mb: 64
    max_frames: 1                       # stop right after the first frame
    max_duration_s: 15                  # safety net: never let the GUI hang waiting


# --- Some guards ---
disk:
    min_free_gb: 1


# --- PTP Settings ---
ptp:
    enabled: false                      # free-running timestamps are fine for a preview
