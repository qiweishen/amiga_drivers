# =============================================================
# GoX Driver Configuration - Snapshot
# =============================================================
# Single-frame profile for jai_snapshot (GUI preview / exposure tuning).
# The tool forces: max_frames 1, max_duration_s 15, ptp off, trigger freerun,
# statistics off, cameras[0] enabled, output under --out.
# Placeholders overridden by the GUI: device.ip (--ip), exposure_ms (--exposure-ms), gain (--gain).
# Unknown keys are errors; omitted keys keep the driver defaults.


# --- Cameras ---
cameras:
    -   id: cam0
        device:
            mac: ""                     # --mac
            ip: "10.95.76.106"          # --ip
        acquisition:
            exposure_ms: 20.0           # > 0; < 900 / frame_rate_hz (10% timing margin)
            gain: 1.0                   # 1.0..126.0
            pixel_format: BayerRG12Packed   # must be in scripts/unpack_raw.py's PFNC table
            frame_rate_hz: 3.0          # >= 0.125; sets the exposure ceiling (factory 8 fps clamps > ~114 ms)

        # =============================================================
        # ADVANCED: do not change without a reason
        # =============================================================
        network:
            buffer_count: 8             # 0 = auto | >= 4
            packet_size: 0              # 0 = negotiate | 1476..12036
            socket_rx_buffer_mb: 16     # 1..1024
            local_ip: ""
            throughput_safety_margin_pct: 0


# =============================================================
# ADVANCED: do not change without a reason
# =============================================================
# --- Output (jai-raw-seg) ---
output:
    segment_size_mb: 1024               # > 0
    record_align: 4096                  # power of two
    queue_max_frames: 4                 # >= 2; pool = queue + 2
    queue_on_full: block                # the single frame must never be dropped
    on_buffer_error: record_flagged     # unpack pads incomplete frames with --pad-incomplete
    flush_interval_mb: 64               # > 0
