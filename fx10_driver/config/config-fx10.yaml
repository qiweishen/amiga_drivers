# =============================================================
# FX10e Driver Configuration
# =============================================================

# Specim FX10e hyperspectral line-scan camera.
# Referenced by config/config-main.yaml ("FX10 Driver Config Path").



# --- Device ---
device:
    mac: ""                             # discovery match; wins over ip
    ip: "10.95.0.100"                   # direct connect; used when mac is empty


# --- Acquisition ---
acquisition:
    spatial_binning: 1                  # 1 | 2 | 4 | 8 -> 1024 | 512 | 256 | 128 samples
    spectral_binning: 2                 # 1 | 2 | 4 | 8 -> 448 | 224 | 112 | 56 bands; 2 = factory (p.44); mroi needs 1
    pixel_format: Mono12Packed          # Mono12Packed | Mono12 | Mono10Packed | Mono10 | Mono8
    exposure_ms: 10.0                   # > 0 (camera range 0.01..419)
    frame_rate_hz: 50.0                 # > 0; freerun rate, or the expected pulse rate under external trigger
    status_line: false                  # true replaces the last image row with camera status (p.34)
    image_enhancement: true             # AIE (p.32); only true is supported (node name unknown, use features.raw)
    trigger:
        mode: freerun                  # freerun | external
        activation: rising              # rising | falling
        delay_ms: 0.0                   # 0..419
        exposure_control: camera        # camera | pulse_width
        selector_entry: FrameStart
        source_entry: Line0             # Line0 = ISO_TRIGGER pin 8
    mroi:
        enabled: false                  # requires 1 x 1 binning (p.9, p.26)
        multiband_string: ""            # "start_row height;..." e.g. "10 20;100 20"; rows 0..1081, height 1..448, total <= 448


# --- Sensor Trigger (Teensy SensorSync, submodule/sensor_trigger) ---
sensor_trigger:
    enabled: false
    port: "/dev/serial/by-id/usb-Teensyduino_USB_Serial_16840200-if00"    # required when enabled
    trigger_channel: 0                  # >= 0; Teensy trig[N] wired to the camera


# =============================================================
# ADVANCED: do not change without a reason
# =============================================================
# --- Features ---
# applied last, in order: { name, type: int | float | bool | enum | string | command, value }
features:
    raw:
        -   { name: LineSelector, type: enum, value: LineOut0 }
        -   { name: LineSource, type: enum, value: ExposureActive }


# --- Output (ENVI BIL) ---
output:
    rotation:
        max_lines: 0                    # 0 = no rotation by line count
        max_mb: 2048                    # 0 = no rotation by size
    flush_interval_mb: 64               # 0..4096; 0 = fdatasync only at segment boundaries (periodic fdatasync runs on a helper thread)
    on_gap: pad_zero                    # record | pad_zero; use .lines.csv, never infer trigger identity from line index
    wavelengths:
        source: none                    # none = uncalibrated DN, NO wavelength axis; file/list requires calibration below
        file: ""                        # calibration-pack text file
        list: []
        grid: { start_nm: 400.0, end_nm: 1000.0 }   # start_nm < end_nm
        fwhm_list: []                   # empty = no fwhm in the .hdr
        # For file/list, add calibration from THIS device's pack (do not guess):
        # calibration: { reference: PACK_REVISION, device_serial: SERIAL,
        #                samples: WIDTH, bands: HEIGHT, offset_x: X, offset_y: Y }
    max_duration_s: 0                   # >= 0; 0 = unlimited
    max_frames: 0                       # >= 0; 0 = unlimited


# --- Network ---
network:
    packet_size: 0                      # 0 = negotiate (jumbo needs MTU 9000)
    socket_rx_buffer_mb: 32             # 1..1024
    buffer_count: auto                  # auto (= 0) | >= 1
    stall_budget_s: 2.0                 # >= 0
    max_buffer_memory_mb: 512           # >= 1
    retrieve_timeout_ms: 1000           # 1..10000
    # No reconnect block: a link loss during a run ends the whole rig (fail-fast)


# --- Logging ---
logging:
    stats_interval_s: 2.5               # >= 0; 0 = off
