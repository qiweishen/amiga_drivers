# =============================================================
# FX10e Driver Configuration - Snapshot
# =============================================================
# Shared camera profile for the Camera workbench and white/dark Reference capture.
# Both tools force freerun without SensorSync or an absolute-time requirement.
# fx10_snapshot captures --frames with a bounded duration into one segment under --out.
# fx10_reference keeps these camera parameters and captures reference.duration_s per phase.
# Workbench-only overrides: device.ip (--ip), exposure_ms (--exposure-ms),
# spatial_binning / spectral_binning (--spatial-binning / --spectral-binning), --fps.
# Unknown keys are errors; omitted keys keep the driver defaults.


# --- Device ---
device:
    mac: ""                             # --mac
    ip: "10.95.0.100"                  # --ip


# --- Acquisition ---
acquisition:
    spatial_binning: 1                  # 1 | 2 | 4 | 8
    spectral_binning: 2                 # 1 | 2 | 4 | 8; mroi needs 1
    pixel_format: Mono12Packed          # Mono12Packed | Mono12 | Mono10Packed | Mono10 | Mono8
    exposure_ms: 5.0                    # > 0
    frame_rate_hz: 50.0                 # used unchanged unless workbench passes --fps
    status_line: false
    image_enhancement: true
    trigger:
        mode: freerun                  # both GUI capture tools enforce freerun
    mroi:
        enabled: false
        multiband_string: ""


# --- Sensor Trigger ---
sensor_trigger:
    enabled: false                     # neither GUI capture tool uses a trigger board


# --- White/dark Reference ---
reference:
    duration_s: 5.0                     # seconds per phase


# Mechanical shutter is a mandatory driver step, with no YAML override:
# after applying config, write MotorShutter_PulseRev = 255 before AcquisitionStart.
# Each write opens the shutter; the stored value does not report shutter state.
# MotorShutter_PulseFwd = 255 closes it and is not issued during normal startup.

# =============================================================
# ADVANCED: do not change without a reason
# =============================================================
# --- Features ---
features:
    raw: []                             # tool timing overrides are appended and read back after these entries


# --- Output (eBUS RAW; offline conversion belongs to amiga_decoders) ---
output:
    flush_interval_mb: 64               # 0..4096
    wavelengths:
        source: none                    # uncalibrated DN; file/list requires a matching calibration profile
        file: ""
        list: []
        grid: { start_nm: 400.0, end_nm: 1000.0 }
        fwhm_list: []


# --- Network ---
network:
    packet_size: 0                      # 0 = negotiate
    socket_rx_buffer_mb: 32             # 1..1024; host net.core.rmem_max must allow 33554432 bytes
    buffer_count: auto                  # auto (= 0): 16 SDK buffers; explicit >= 1 (subject to SDK/memory caps)
    stall_budget_s: 2.0                 # >= 0; sizes the owned application frame queue
    max_buffer_memory_mb: 512           # >= 1; combined SDK + application payload buffers + unpack scratch
    retrieve_timeout_ms: 1000           # 1..10000
    # No reconnect block: a link loss ends the run (fail-fast)
