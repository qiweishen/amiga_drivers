# =============================================================
# LMS4xxx Driver Configuration
# =============================================================

# SICK LMS4xxx 2D LiDAR (CoLa B over TCP), one lidar[] entry per device.
# Referenced by config/config-main.yaml ("LMS4XXX Driver Config Path").


# --- LiDARs ---
lidar:
    -   id: Front_Left_Laser            # 1..63 chars [A-Za-z0-9_-]; log tag and file name
        enabled: false                  # at least one must be enabled
        device:
            ip: "10.95.76.101"          # IPv4, unique among enabled entries
            port: 2111                  # 1..65535; CoLa B
    -   id: Front_Right_Laser
        enabled: false
        device:
            ip: "10.95.76.103"
            port: 2111
    -   id: Front_Center_Laser
        enabled: true
        device:
            ip: "10.95.76.102"
            port: 2111


# --- Scan ---
scan:
    remission: rssi                     # rssi | refl (p.85); everything else is fixed by the driver (docs/DEVICE_CONFIG.md)


# =============================================================
# ADVANCED: do not change without a reason
# =============================================================
# --- NTP (device clock) ---
# The only absolute time source of the LiDAR: with NTP off the scans carry
# nothing but the device uptime (wraps every 71.6 min) and cannot be associated
# with any other sensor offline — the driver warns loudly. Host time is never
# used. The device must be able to reach the server (AsteRx RBi3 Pro+, GPS time)
# from its own subnet: see docs/DEVICE_CONFIG.md, "Time".
ntp:
    enabled: true
    server: "10.95.2.102"               # IPv4; required when enabled (AsteRx RBi3 Pro+ NTP server)
    sync_interval_s: 1                  # 1..3600
    check_status_s: 5                   # 1..3600; server probe period while scanning
    lock_timeout_s: 60                  # 1..3600; plausible date deadline; earlier scans retained with quality flags
    max_time_step_ms: 1000              # 1..60000; device time vs uptime disagreement between scans that faults the run


# --- Telemetry ---
telemetry:
    interval_s: 10                      # 0..3600; 0 = off; stored in the .h5 /telemetry group


# --- Output (HDF5) ---
output:
    queue_max_frames: 512               # 2..1048576
    max_file_bytes: 1073741824          # 0 = no splitting | >= 1048576
    chunk_frames: 64                    # 1..4096
    flush_interval_ms: 1000             # 1..60000
    compression_level: 0                # 0..9; 0 = off
    swmr: false                         # must remain false: v3 string datasets do not support SWMR append


# --- Network ---
network:
    recv_buffer_bytes: 4194304          # 65536..268435456 (SO_RCVBUF)
    ring_buffer_frames: 1024            # 16..1048576
    receive_thread_priority: 99         # 1..99 (SCHED_FIFO)
    receive_thread_cpu: -1              # -1 = no pinning | 0..ncpu-1
    connect_timeout_ms: 500             # 100..60000
    response_timeout_ms: 200            # 100..60000; variable access while scanning
    config_timeout_ms: 2000             # 100..60000; per SOPAS round trip during Configure()
    tcp_keepalive: true
    keepalive_idle_s: 10                # 1..7200
    keepalive_interval_s: 5             # 1..7200
    keepalive_count: 3                  # 1..100


# --- Logging ---
logging:
    stats_interval_s: 2.5               # 0..3600; 0 = off
