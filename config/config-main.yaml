# =============================================================
# Amiga Driver Configuration
# =============================================================


# --- General Settings ---
General:
    # Metadata
    Operator: <Dev>
    # Field info
    Field: <Test>

    # Root output data directory for all output
    Output Directory: ./data

    # Per-driver enable switches
    # It will be overrided by GUI
    Enable ASTERX: false
    Enable FX10: false
    Enable GOX: false
    Enable LMS4XXX: false

    # =============================================================
    # ADVANCED: do not change without a reason
    # =============================================================
    # Path to the configuration files for each driver
    ASTERX Driver Config Path: ./asterx_driver/config/config-asterx.yaml
    FX10 Driver Config Path: ./fx10_driver/config/config-fx10.yaml
    GOX Driver Config Path: ./gox_driver/config/config-gox.yaml
    LMS4XXX Driver Config Path: ./lms4xxx_driver/config/config-lms4xxx.yaml


# --- Sensor Trigger (Teensy SensorSync-Logger board) ---
# The rig's one hardware trigger / timing board, shared by the FX10 (FX pair, channels 0/1)
# and the Go-X cameras (JAI pair, channels 2/3). Named here once; the driver configs only
# say whether they use it and on which channel. The timing log is raw/sensor_trigger.log.
Sensor Trigger:
    Port: "/dev/serial/by-id/usb-Teensyduino_USB_Serial_16838390-if00"   # by-id survives re-enumeration; "" = no board


# --- Rig-wide guards ---
# One policy for every enabled driver, enforced by the unified main.
Guards:
    # GiB available to an unprivileged writer, i.e. what the GUI's disk gauge shows
    Disk Min Free GiB: 5        # hard floor: stop the whole run cleanly (0 = off)
    Disk Warn Free GiB: 20      # soft floor: warn once per crossing (0 = off)

    # A sensor that stops delivering data.
    #Drivers that expect to be idle (external trigger with no pulses, warm-up) are exempt while they say so.
    No Data Warn S: 15           # warn after this much silence (0 = off)
    # Keep this ABOVE the AsteRx driver's own 30 s SBF watchdog, which triggers a
    # RECONNECT: at 30 s the two race and a recoverable link blip would end the
    # whole run instead of being repaired.
    No Data Abort S: 60         # stop the whole run after this much silence (0 = off)
