# Rig network inventory (documentation only; the drivers read their own YAML).

Septentrio AsteRx RBi3 Pro+:
    IP: 10.95.76.110
    Ethernet Port: enp1s0f2
    Subnetwork: 10.95.2.1
    Serves: NTP (GPS timescale)


# GVSP needs MTU 9000 + net.core.rmem_max (see fx10_driver/docs/DEVICE_CONFIG.md)
Specim FX10e:
    IP: 10.95.0.100
    Ethernet Port: enp1s0f0
    Subnetwork: 10.95.0.1
    Time Synchronization: Teensy SensorSync-Logger board


# GVSP needs MTU 9000
JAI Go-X:
    IP: 10.95.1.101
    Ethernet Port: enp1s0f1
    Subnetwork: 10.95.1.1
    Time Synchronization: Teensy SensorSync-Logger board


# NTP clients of the AsteRx: the devices must be able to route to 10.95.76.110 (via PLANET switch)
SICK LMS4xxx:
    Front Left Laser:
        IP: 10.95.76.101
    Front Center Laser (Test):
        IP: 10.95.76.102
    Front Right Laser:
        IP: 10.95.76.103
    Ethernet Port: eno1
    Subnetwork: 10.95.76.255
    Time Synchronization: NTP (Septentrio AsteRx RBi3 Pro+)


# The Teensy SensorSync-Logger board (hardware trigger pulses + timing log) is a
# USB serial device, not an IP host: its /dev/serial/by-id/... path is set ONCE in
# config/config-main.yaml ("Sensor Trigger: Port"). FX pair (channels 0/1) -> FX10,
# JAI pair (channels 2/3) -> Go-X Line5 in / Line2 ExposureActive out.
