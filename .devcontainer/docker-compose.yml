services:
    amiga-drivers-dev:
        container_name: amiga-drivers-dev
        image: amiga-drivers-dev:local
        build:
            context: ..
            dockerfile: .devcontainer/Dockerfile
            target: drivers
            args:
                USER_UID: ${AMIGA_UID:-1000}
                USER_GID: ${AMIGA_GID:-1000}

        # The GUI manages the C++ acquisition process inside this container.
        init: true
        restart: unless-stopped
        command: ["/usr/bin/python3", "-B", "-m", "app.main"]
        stop_signal: SIGTERM
        stop_grace_period: 180s
        stdin_open: true
        tty: true

        # Network and IPC
        network_mode: host
        ipc: host
        # Match the hostname in the host's local Xauthority records (Compose >= 2.15.1).
        uts: host
        cap_add:
            - NET_ADMIN
            - NET_RAW
            # Required file/effective capabilities must be provisioned separately;
            # starting the GUI or using GUI Start does not run setcap.
            - SYS_NICE

        environment:
            PYTHONUNBUFFERED: 1
            PYTHONDONTWRITEBYTECODE: 1
            # Linux host networking; this address selects the listening interface.
            AMIGA_GUI_HOST: ${AMIGA_GUI_HOST:-0.0.0.0}
            AMIGA_GUI_PORT: "8619"
            NICEGUI_STORAGE_PATH: /tmp/nicegui
            AMIGA_MAIN_CONFIG: /workspace/config/config-main.yaml
            AMIGA_SNAPSHOT_CONFIG: /workspace/gox_driver/config/config-gox-snapshot.yaml
            AMIGA_CONFIG_ROOT: /workspace
            AMIGA_DATA_ROOT: /workspace
            AMIGA_RUNTIME_DIR: /workspace/app/_runtime
            AMIGA_CONTROL_LOCK: /workspace/app/_runtime/controller.lock
            # Forward the host's Xorg or XWayland display into the container.
            # Inherit the active host session; do not invent :0 for headless sessions.
            DISPLAY: ${DISPLAY:-}
            XAUTHORITY: /tmp/.host.xauth
            QT_QPA_PLATFORM: xcb
            GDK_BACKEND: x11
            # Host user runtime for audio; GUI forwarding uses the X11 socket below.
            XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR:-/run/user/1000}
            PULSE_SERVER: ${PULSE_SERVER:-unix:/run/user/1000/pulse/native}
            # Software rendering (set 0 for GPU acceleration)
            LIBGL_ALWAYS_SOFTWARE: 1

        devices:
            # Teensy trigger board
            - /dev/ttyACM0:/dev/ttyACM0

        group_add:
            - "20" # dialout

        volumes:
            - ..:/workspace
            # Mount our dataset directory
            - /mnt/SharedData/Post_Processing_Data:/workspace/dataset
            # Use the existing host desktop authorization file directly; no setup hook.
            # Missing sources must fail instead of becoming empty directories.
            -   type: bind
                source: /tmp/.X11-unix
                target: /tmp/.X11-unix
                read_only: true
                bind:
                    create_host_path: false
            -   type: bind
                source: "${XAUTHORITY:-${HOME}/.Xauthority}"
                target: /tmp/.host.xauth
                read_only: true
                bind:
                    create_host_path: false
            # User runtime (audio, D-Bus, etc.)
            - ${XDG_RUNTIME_DIR:-/run/user/1000}:${XDG_RUNTIME_DIR:-/run/user/1000}
            # Teensy trigger board
            - /dev/serial/by-id:/dev/serial/by-id:ro
            - /dev:/dev

        working_dir: /workspace
        healthcheck:
            test: [CMD, /usr/bin/python3, -I, -B, /workspace/.devcontainer/gui_healthcheck.py]
            interval: 5s
            timeout: 3s
            retries: 6
            start_period: 30s
