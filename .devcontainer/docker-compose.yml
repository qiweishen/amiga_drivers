services:
    amiga-drivers-dev:
        container_name: amiga-drivers-dev
        image: amiga-drivers-dev:local
        build:
            context: ..
            dockerfile: .devcontainer/Dockerfile
            target: drivers
            args:
                USER_UID: ${AMIGA_UID:-1000}
                USER_GID: ${AMIGA_GID:-1000}

        # Controller owns acquisition; interactive IDE/docker exec access remains.
        init: true
        restart: unless-stopped
        command: ["/opt/venv/bin/python", "-B", "-m", "app.controller"]
        stop_signal: SIGTERM
        stop_grace_period: 180s
        stdin_open: true
        tty: true

        # Network and IPC
        network_mode: host
        ipc: host
        # Match the hostname in the host's local Xauthority records (Compose >= 2.15.1).
        uts: host
        cap_add:
            - NET_ADMIN
            - NET_RAW
            # Required file/effective capabilities must be provisioned separately;
            # starting the controller or using GUI Start does not run setcap.
            - SYS_NICE

        environment:
            PYTHONUNBUFFERED: 1
            PYTHONDONTWRITEBYTECODE: 1
            AMIGA_GUI_MODE: native
            AMIGA_CONTROLLER_HOST: 127.0.0.1
            AMIGA_CONTROLLER_PORT: "8620"
            AMIGA_CONTROLLER_TOKEN_FILE: /workspace/app/_runtime/controller-token
            AMIGA_CONTROLLER_BOOTSTRAP_TOKEN: "1"
            AMIGA_MAIN_CONFIG: /workspace/config/config-main.yaml
            AMIGA_SNAPSHOT_CONFIG: /workspace/gox_driver/config/config-gox-snapshot.yaml
            AMIGA_CONFIG_ROOT: /workspace
            AMIGA_DATA_ROOT: /workspace
            AMIGA_RUNTIME_DIR: /workspace/app/_runtime
            AMIGA_CONTROL_LOCK: /workspace/app/_runtime/controller.lock
            AMIGA_PYTHON: /opt/venv/bin/python
            # Xorg on Ubuntu 22.04, or XWayland on a Wayland desktop (22.04/26.04).
            # Inherit the active host session; do not invent :0 for headless sessions.
            DISPLAY: ${DISPLAY:-}
            XAUTHORITY: /tmp/.host.xauth
            QT_QPA_PLATFORM: xcb
            GDK_BACKEND: x11
            # Host user runtime for audio; GUI forwarding uses the X11 socket below.
            XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR:-/run/user/1000}
            PULSE_SERVER: ${PULSE_SERVER:-unix:/run/user/1000/pulse/native}
            # Software rendering (set 0 for GPU acceleration)
            LIBGL_ALWAYS_SOFTWARE: 1

#        devices:
#            # Teensy trigger board
#            - /dev/ttyACM0:/dev/ttyACM0
#
#        group_add:
#            - "20" # dialout

        volumes:
            - ..:/workspace
            - /mnt/SharedData/Post_Processing_Data:/workspace/dataset
            # Use the existing host desktop authorization file directly; no setup hook.
            # Missing sources must fail instead of becoming empty directories.
            -   type: bind
                source: /tmp/.X11-unix
                target: /tmp/.X11-unix
                read_only: true
                bind:
                    create_host_path: false
            -   type: bind
                source: "${XAUTHORITY:-${HOME}/.Xauthority}"
                target: /tmp/.host.xauth
                read_only: true
                bind:
                    create_host_path: false
            # User runtime (audio, D-Bus, etc.)
            - ${XDG_RUNTIME_DIR:-/run/user/1000}:${XDG_RUNTIME_DIR:-/run/user/1000}
            # Teensy trigger board
            - /dev/serial/by-id:/dev/serial/by-id:ro
            - /dev:/dev

        working_dir: /workspace
        healthcheck:
            test: [CMD, /opt/venv/bin/python, -I, -B, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8620/healthz', timeout=2).close()"]
            interval: 5s
            timeout: 3s
            retries: 6
            start_period: 30s

    gui:
        image: amiga-gui:dev
        build:
            context: ..
            dockerfile: .devcontainer/Dockerfile
            target: gui
            args:
                USER_UID: ${AMIGA_UID:-1000}
                USER_GID: ${AMIGA_GID:-1000}
        init: true
        restart: unless-stopped
        read_only: true
        cap_drop: [ALL]
        security_opt: [no-new-privileges:true]
        # Both services use Linux host networking so the API stays on loopback.
        # No published ports, Docker socket or device mounts are needed by GUI.
        network_mode: host
        depends_on:
            amiga-drivers-dev:
                condition: service_healthy
        command: ["/opt/venv/bin/python", "-B", "-m", "app.main"]
        working_dir: /workspace
        stop_grace_period: 15s
        environment:
            AMIGA_CONTROLLER_URL: http://127.0.0.1:8620
            AMIGA_CONTROLLER_TOKEN_FILE: /workspace/app/_runtime/controller-token
            AMIGA_MAIN_CONFIG: /workspace/config/config-main.yaml
            AMIGA_SNAPSHOT_CONFIG: /workspace/gox_driver/config/config-gox-snapshot.yaml
            AMIGA_CONFIG_ROOT: /workspace
            AMIGA_DATA_ROOT: /workspace
            AMIGA_RUNTIME_DIR: /tmp/amiga-gui
            AMIGA_PYTHON: /opt/venv/bin/python
            AMIGA_GUI_HOST: 127.0.0.1
            AMIGA_GUI_PORT: "8619"
            NICEGUI_STORAGE_PATH: /tmp/nicegui
            PYTHONDONTWRITEBYTECODE: "1"
            PYTHONUNBUFFERED: "1"
        tmpfs: [/tmp]
        volumes:
            - type: bind
              source: ..
              target: /workspace
              read_only: true
              bind: {create_host_path: false}
            - type: bind
              source: /mnt/SharedData/Post_Processing_Data
              target: /workspace/dataset
              read_only: true
              bind: {create_host_path: false}
        healthcheck:
            test: [CMD, /opt/venv/bin/python, -I, -B, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8619/healthz', timeout=2).close()"]
            interval: 15s
            timeout: 3s
            retries: 3
            start_period: 30s
