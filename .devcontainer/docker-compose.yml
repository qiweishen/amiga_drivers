services:
    amiga-drivers-dev:
        container_name: amiga-drivers-dev
        build:
            context: ..
            dockerfile: .devcontainer/Dockerfile

        # Keep container running for interactive use
        stdin_open: true
        tty: true

        # Network and IPC
        network_mode: host
        ipc: host
        # Match the hostname in the host's local Xauthority records (Compose >= 2.15.1).
        uts: host
        cap_add:
            - NET_ADMIN
            - NET_RAW
            # AmigaDrivers carries file caps cap_net_raw,cap_sys_nice+ep (Start.bash / GUI setcap)
            - SYS_NICE

        environment:
            PYTHONUNBUFFERED: 1
            # Xorg on Ubuntu 22.04, or XWayland on a Wayland desktop (22.04/26.04).
            # Inherit the active host session; do not invent :0 for headless sessions.
            DISPLAY: ${DISPLAY:-}
            XAUTHORITY: /tmp/.host.xauth
            QT_QPA_PLATFORM: xcb
            GDK_BACKEND: x11
            # Host user runtime for audio; GUI forwarding uses the X11 socket below.
            XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR:-/run/user/1000}
            PULSE_SERVER: ${PULSE_SERVER:-unix:/run/user/1000/pulse/native}
            # Software rendering (set 0 for GPU acceleration)
            LIBGL_ALWAYS_SOFTWARE: 1

#        devices:
#            # Teensy trigger board
#            - /dev/ttyACM0:/dev/ttyACM0
#
#        group_add:
#            - "20" # dialout

        volumes:
            - ..:/workspace
            - /mnt/SharedData/Post_Processing_Data:/workspace/dataset
            # Use the existing host desktop authorization file directly; no setup hook.
            # Missing sources must fail instead of becoming empty directories.
            -   type: bind
                source: /tmp/.X11-unix
                target: /tmp/.X11-unix
                read_only: true
                bind:
                    create_host_path: false
            -   type: bind
                source: "${XAUTHORITY:-${HOME}/.Xauthority}"
                target: /tmp/.host.xauth
                read_only: true
                bind:
                    create_host_path: false
            # User runtime (audio, D-Bus, etc.)
            - ${XDG_RUNTIME_DIR:-/run/user/1000}:${XDG_RUNTIME_DIR:-/run/user/1000}
            # Teensy trigger board
            - /dev/serial/by-id:/dev/serial/by-id:ro
            - /dev:/dev

        working_dir: /workspace
