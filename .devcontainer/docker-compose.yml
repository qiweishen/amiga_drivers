services:
    amiga-drivers-dev:
        container_name: amiga-drivers-dev
        image: amiga-drivers-dev:local
        build:
            context: ..
            dockerfile: .devcontainer/Dockerfile
            target: drivers
            args:
                USER_UID: ${AMIGA_UID:-1000}
                USER_GID: ${AMIGA_GID:-1000}

        # The GUI manages the C++ acquisition process inside this container.
        init: true
        restart: unless-stopped
        command: ["/usr/bin/python3", "-B", "-m", "app.main"]
        stop_signal: SIGTERM
        stop_grace_period: 180s
        stdin_open: true
        tty: true

        # Network and IPC
        network_mode: host
        ipc: host
        cap_add:
            - NET_ADMIN
            - NET_RAW
            - SYS_NICE

        environment:
            PYTHONUNBUFFERED: 1
            PYTHONDONTWRITEBYTECODE: 1
            # X11 programs (eBUS Player) start through .devcontainer/x11-exec.sh, which
            # passes the caller's DISPLAY (an `ssh -Y` session on a headless host, or a
            # local desktop) and copies that session's X cookie to XAUTHORITY.
            # Empty on a headless host; the web GUI and the drivers need no display.
            DISPLAY: ${DISPLAY:-}
            XAUTHORITY: /tmp/.x11.xauth
            QT_QPA_PLATFORM: xcb
            GDK_BACKEND: x11
            # Host user runtime for audio; GUI forwarding uses the X11 socket below.
            XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR:-/run/user/1000}
            PULSE_SERVER: ${PULSE_SERVER:-unix:/run/user/1000/pulse/native}
            # Software rendering (set 0 for GPU acceleration)
            LIBGL_ALWAYS_SOFTWARE: 0
            # Linux host networking; this address selects the listening interface.
            AMIGA_GUI_HOST: ${AMIGA_GUI_HOST:-0.0.0.0}
            AMIGA_GUI_PORT: "8619"
            NICEGUI_STORAGE_PATH: /tmp/nicegui
            AMIGA_MAIN_CONFIG: /workspace/config/config-main.yaml
            AMIGA_SNAPSHOT_CONFIG: /workspace/gox_driver/config/config-gox-snapshot.yaml
            AMIGA_CONFIG_ROOT: /workspace
            AMIGA_DATA_ROOT: /workspace
            AMIGA_RUNTIME_DIR: /workspace/app/_runtime
            AMIGA_CONTROL_LOCK: /workspace/app/_runtime/controller.lock

        # No `devices:` entries: Compose refuses to start when a listed node is
        # missing (test machines have no Teensy). /dev is bind-mounted below, so
        # nodes that exist (or are plugged in later) are visible; these rules only
        # grant access to them, and match nothing on a machine without the device.
        device_cgroup_rules:
            # KEYLOK hiddev minor numbers can change after replug or reboot.
            - "c 180:* rw"
            # Teensy trigger board (USB CDC ACM, /dev/ttyACM*; config uses /dev/serial/by-id/...).
            - "c 166:* rw"

        group_add:
            - "20"      # dialout
            - "1000"    # GROUP in resource/99-pleora-keylok.rules

        volumes:
            - ..:/workspace
            # Mount our dataset directory
            - /mnt/SharedData/Post_Processing_Data:/workspace/dataset
            # Share new device nodes and the host udev aliases (/dev/usb/hid/hiddev0,
            # /dev/serial/by-id/... for the Teensy, present only when plugged in).
            # Do not bind individual nodes: they fail when absent and go stale after replug.
            - /dev:/dev
            # No ~/.Xauthority mount: Docker creates a missing source as a directory
            # (which then breaks SSH X11 forwarding on the host), and xauth replaces
            # the file at every SSH login, so a file mount keeps a stale cookie.
            # x11-exec.sh copies the current cookie into the container instead.
            # User runtime (audio, D-Bus, etc.).
            - ${XDG_RUNTIME_DIR:-/run/user/1000}:${XDG_RUNTIME_DIR:-/run/user/1000}

        working_dir: /workspace
        healthcheck:
            test: [CMD, /usr/bin/python3, -I, -B, /workspace/.devcontainer/gui_healthcheck.py]
            interval: 5s
            timeout: 3s
            retries: 6
            start_period: 30s
