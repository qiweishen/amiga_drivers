# =============================================================
# AsteRx Driver Configuration
# =============================================================

# Septentrio AsteRx GNSS/INS receiver configuration.
# Referenced by config/config-main.yaml ("ASTERX Driver Config Path").


# --- General Settings ---
device:
    ip: "10.95.2.102"    # receiver IP or hostname
    # Single TCP connection: ASCII commands AND the SBF stream share it.
    port: 28784    # plaintext command port (28783 = TLS, not implemented)
    user: "admin"
    password: "septentrio"


# --- Receiver Settings ---
receiver:
    require_aux1: true  # fail fast if the receiver has no Aux1 capability

    imu:
        # Boot records raw ExtSensorMeas before GNSS time is known.
        # Those early frames may carry invalid timestamps.
        startup_data_mode: GnssTimeKnown    # Boot | GnssTimeKnown

        # SensorDefault assumes the marked IMU X axis points forward, Y right, Z down.
        orientation_mode: SensorDefault    # SensorDefault | manual | fixed
        theta_x_deg: 0.0
        theta_y_deg: 0.0
        theta_z_deg: 0.0

        # Lever arm from IMU reference point to main GNSS antenna ARP, expressed in the vehicle frame, meters.
        ant_lever_arm_m:
            x: 0.0
            y: 0.0
            z: 0.0

    gnss_attitude:
        mode: MultiAntenna    # MultiAntenna | none
        attitude_offset_deg:
            heading: 0.0
            pitch: 0.0

    tracking:
        # Reset receiver-side filters on startup so stale settings cannot silently disable a constellation/frequency.
        enable_all: true
        cn0_mask_dbhz: 0

    # OnChange means the receiver's natural renewal rate, avoiding driver-side decimation.
    # Allowed intervals:
    #     OnChange
    #     msec5 msec10 msec20 msec40 msec50 msec100 msec200 msec500
    #     sec1 sec2 sec5 sec10 sec15 sec30 sec60 min2 min5 min10 min15 min30 min60
    streams:
        -   id: 1
            blocks: [ "ExtSensorMeas" ]                                           # raw IMU
            interval: "OnChange"
        -   id: 2
            blocks: [ "MeasEpoch", "MeasExtra", "EndOfMeas" ]                     # main+Aux1 raw obs
            interval: "OnChange"
        -   id: 3
            blocks: [ "AuxAntPositions", "AttEuler", "AttCovEuler", "EndOfAtt" ]  # baseline + attitude
            interval: "OnChange"
        -   id: 4
            blocks: [ "ExtSensorStatus", "ExtSensorInfo", "IMUSetup" ]            # IMU setup/status
            interval: "OnChange"
        -   id: 5
            blocks: [ "ReceiverStatus", "QualityInd", "ReceiverTime", "ChannelStatus" ]
            interval: "OnChange"
        -   id: 6
            # Navigation ephemeris, UTC/ionosphere models, raw nav bits and orrection/setup context
            # needed for self-contained RTK/PPK/RINEX export.
            # Kept separate from the Measurements stream to avoid duplicate MeasEpoch.
            blocks: [ "GPS", "GLO", "GAL", "BDS", "QZS", "RawNavBits",
                      "ReceiverSetup", "Commands", "DiffCorr" ]
            interval: "OnChange"
        -   id: 7
            # Absolute position for the live map + fused INS pose (live_*.csv / web GUI).
            # NOT OnChange: the INS solution renews at up to 200 Hz;
            # msec100 caps both blocks at 10 Hz — plenty for the 0.5 s GUI tail and ~16 MB/h of CSV.
            blocks: [ "PVTGeodetic", "INSNavGeod" ]
            interval: "msec100"


# =============================================================
# NOT RECOMMEND TO CHANGE
# =============================================================
# --- Output Settings ---
output:
    output_dir: "./recordings"    # overridden to <data_folder>/bin/asterx/ in unified mode
    file_prefix: "asterx"
    # Real-time per-block live_*.csv beside the .sbf (feeds the web GUI's AsteRx Live page).
    # Parse/write failures only disable the CSV, never affect the .sbf recording.
    live_csv: true
    # Must stay < 2 GiB.
    # The RxTools converters (sbf2rin/sbf2asc) refuse SBF inputs of 2 GB or larger.
    # Rotation doubles as the post-processing guarantee.
    rotate_bytes: 1073741824    # 1 GiB
    rotate_interval_s: 3600     # 1 hour


# --- Statistics Interval Time ---
stats_period_s: 2.5
